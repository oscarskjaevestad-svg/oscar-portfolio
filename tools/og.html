<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: radial-gradient(ellipse 900px 520px at 10% 0, rgba(143,168,255,.16), transparent 70%), #141210;
    color: #ece6dc; font-family: 'Schibsted Grotesk', sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 84px; box-sizing: border-box;
  }
  .site { font: 500 22px 'JetBrains Mono', monospace; letter-spacing: .12em; color: #968e82; display: flex; align-items: center; gap: 16px; }
  .mark { width: 40px; height: 40px; }
  h1 { margin: 0; font-size: 104px; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
  .role { margin-top: 22px; font-size: 38px; font-weight: 500; color: #a39b8f; }
  .role b { color: #ece6dc; font-weight: 500; }
  .now { display: flex; align-items: center; gap: 16px; font: 500 21px 'JetBrains Mono', monospace; letter-spacing: .1em; color: #8fa8ff; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #8fa8ff; box-shadow: 0 0 0 6px rgba(143,168,255,.15); }
  .rule { height: 2px; background: #2e2a25; margin: 0 0 26px; }
</style></head>
<body>
  <div class="site"><img class="mark" src="../favicon.svg" alt="">OSCARNS.COM</div>
  <div>
    <h1>Oscar Skjævestad</h1>
    <p class="role">Team lead, <b>IT &amp; robot deployment</b> · Wybe Robotics</p>
  </div>
  <div>
    <div class="rule"></div>
    <div class="now"><span class="dot"></span>NOW · DEPLOYING HUMANOID ROBOTS · BUILDING AN INMOOV HAND</div>
  </div>
</body></html>
